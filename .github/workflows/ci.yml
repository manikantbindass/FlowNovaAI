name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: flownova, POSTGRES_PASSWORD: flownova-test, POSTGRES_DB: flownova}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U flownova" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21, cache: maven}
      - run: chmod +x apps/api/mvnw
      - run: ./mvnw -B -ntp verify
        working-directory: apps/api
      - run: ./mvnw -B -ntp test -Dtest=WorkflowIntegrationTests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/flownova
          DATABASE_USER: flownova
          DATABASE_PASSWORD: flownova-test
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Scan API container
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL flownovaai-api
      - name: Scan tracked source for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest dir /repo --no-banner --redact
