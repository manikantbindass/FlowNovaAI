name: Windows desktop
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/desktop/**', 'scripts/desktop-smoke.mjs', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'scripts/desktop-smoke.mjs', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --prefix apps/desktop
      - run: npm test --prefix apps/desktop
      - run: npm audit --prefix apps/desktop --audit-level=high
      - run: npm run dist --prefix apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged desktop client
        run: node scripts/desktop-smoke.mjs
      - name: Compute checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/dist/*.exe | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content apps/desktop/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FlowNova-AI-Windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
