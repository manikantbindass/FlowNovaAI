spring.application.name=FlowNova
spring.profiles.default=local
server.port=8080
server.address=127.0.0.1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=256KB
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.data/flownova;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.h2.console.enabled=false
flownova.ai.key=${OPENAI_API_KEY:}
flownova.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
flownova.local.password=${LOCAL_PASSWORD:demo}
