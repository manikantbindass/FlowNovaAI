name: flownovaai
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flownova
      POSTGRES_USER: ${DATABASE_USER:-flownova}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-flownova-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d flownova"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/flownova
      DATABASE_USER: ${DATABASE_USER:-flownova}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-flownova-local}
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    command: ["java", "-jar", "/app/api.jar", "--server.address=0.0.0.0"]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_ORIGIN: http://api:8080
      HOSTNAME: 0.0.0.0
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres-data:
